<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel Admin | MCME</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>

<body class="admin-page">

<header id="app-header">
  <div class="header-left">
    <img
      src="assets/images/mcme-logo.svg"
      alt="MCME"
      class="app-logo"
    />
  </div>

  <div class="header-right">
    <strong class="admin-badge">Administrador</strong>
    <button id="logoutBtn" class="admin-logout">Cerrar sesión</button>
  </div>
</header>

<main class="admin-container">

  <h1 class="admin-title">Panel de Control de Usuarios</h1>

  <div class="admin-grid">

    <!-- ===================== -->
    <!-- PENDIENTES -->
    <!-- ===================== -->
    <section class="admin-section pending-section">
      <h2>Usuarios pendientes</h2>
      <ul id="users" class="admin-list"></ul>
    </section>

    <!-- ===================== -->
    <!-- APROBADOS -->
    <!-- ===================== -->
    <section class="admin-section approved-section">
      <h2>Usuarios aprobados</h2>
      <ul id="approvedUsers" class="admin-list"></ul>
    </section>

    <!-- ===================== -->
    <!-- SUSPENDIDOS -->
    <!-- ===================== -->
    <section class="admin-section suspended-section">
      <h2>Usuarios suspendidos</h2>
      <ul id="suspendedUsers" class="admin-list"></ul>
    </section>

  </div>

</main>

<script>
const ADMIN_EMAIL = "sorcrar@gmail.com";
const API = "https://mcme-backend.onrender.com/api/admin";

// ==========================
// SEGURIDAD
// ==========================
const session = JSON.parse(localStorage.getItem("user"));
if (!session || session.email !== ADMIN_EMAIL) {
  window.location.href = "login.html";
}

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("user");
  window.location.href = "login.html";
};

// ==========================
// RENDER CARD
// ==========================
function createUserCard(user, actionsHtml) {
  return `
    <li>
      <div class="admin-user-card">
        <div class="admin-user-info">
          <strong>${user.name}</strong>
          <span>${user.email}</span>
        </div>
        <div class="admin-actions">
          ${actionsHtml}
        </div>
      </div>
    </li>
  `;
}

// ==========================
// PENDIENTES
// ==========================
async function loadUsers() {
  const res = await fetch(`${API}/pending`, {
    headers: { "x-admin-email": ADMIN_EMAIL }
  });

  const users = await res.json();
  const ul = document.getElementById("users");
  ul.innerHTML = "";

  if (users.length === 0) {
    ul.innerHTML = `<p class="empty-state">No hay usuarios pendientes.</p>`;
    return;
  }

  users.forEach(u => {
    ul.innerHTML += createUserCard(
      u,
      `
        <button class="admin-btn btn-approve" onclick="approve('${u.email}')">
          Aprobar
        </button>
        <button class="admin-btn btn-reject" onclick="reject('${u.email}')">
          Rechazar
        </button>
      `
    );
  });
}

async function approve(email) {
  await fetch(`${API}/approve`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadUsers();
  loadApprovedUsers();
}

async function reject(email) {
  await fetch(`${API}/reject`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadUsers();
}

// ==========================
// APROBADOS
// ==========================
async function loadApprovedUsers() {
  const res = await fetch(`${API}/approved`, {
    headers: { "x-admin-email": ADMIN_EMAIL }
  });

  const users = await res.json();
  const ul = document.getElementById("approvedUsers");
  ul.innerHTML = "";

  if (users.length === 0) {
    ul.innerHTML = `<p class="empty-state">No hay usuarios aprobados.</p>`;
    return;
  }

  users.forEach(u => {
    ul.innerHTML += createUserCard(
      u,
      `
        <button class="admin-btn btn-revoke" onclick="revoke('${u.email}')">
          Quitar acceso
        </button>
      `
    );
  });
}

async function revoke(email) {
  await fetch(`${API}/revoke`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadApprovedUsers();
  loadSuspendedUsers();
}

// ==========================
// SUSPENDIDOS
// ==========================
async function loadSuspendedUsers() {
  const res = await fetch(`${API}/suspended`, {
    headers: { "x-admin-email": ADMIN_EMAIL }
  });

  const users = await res.json();
  const ul = document.getElementById("suspendedUsers");
  ul.innerHTML = "";

  if (users.length === 0) {
    ul.innerHTML = `<p class="empty-state">No hay usuarios suspendidos.</p>`;
    return;
  }

  users.forEach(u => {
    ul.innerHTML += createUserCard(
      u,
      `
        <button class="admin-btn btn-reactivate" onclick="reactivate('${u.email}')">
          Reactivar acceso
        </button>
      `
    );
  });
}

async function reactivate(email) {
  await fetch(`${API}/reactivate`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadSuspendedUsers();
  loadApprovedUsers();
}

// ==========================
// INICIO
// ==========================
loadUsers();
loadApprovedUsers();
loadSuspendedUsers();
</script>

</body>
</html>
