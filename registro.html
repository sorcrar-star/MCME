<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Biblioteca Médica</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/registro.css" />
</head>

<body class="login-page">

<main class="login-container">

  <!-- Toggle Dark Mode -->
  <button id="themeToggle" class="theme-toggle">
    🌙 Modo oscuro
  </button>

  <img 
    src="assets/images/mcme-logo.svg" 
    alt="MCME"
    style="width:220px;margin-bottom:1.5rem" 
  />

  <form id="registerForm" class="login-form">
    <input placeholder="Nombres" id="nombres" required />
    <input placeholder="Apellidos" id="apellidos" required />
    <input type="date" id="nacimiento" required />
    <input placeholder="Nombre de usuario" id="username" required />
    <input type="email" placeholder="Correo" id="email" required />
    <input type="password" placeholder="Contraseña" id="password" required />
    <input type="password" placeholder="Confirmar contraseña" id="confirm" required />

    <button type="submit">Registrar cuenta</button>
  </form>

  <button 
    class="crear-cuenta" 
    type="button"
    onclick="window.location.href='login.html'">
    Volver al login
  </button>

</main>

<script>
/* ===============================
   DARK MODE (MISMO SISTEMA LOGIN)
================================ */

const toggleBtn = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
}

toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  if (document.body.classList.contains("dark-mode")) {
    localStorage.setItem("theme", "dark");
    toggleBtn.textContent = "☀️ Modo claro";
  } else {
    localStorage.setItem("theme", "light");
    toggleBtn.textContent = "🌙 Modo oscuro";
  }
});

if (document.body.classList.contains("dark-mode")) {
  toggleBtn.textContent = "☀️ Modo claro";
}


/* ===============================
   REGISTRO
================================ */

document.getElementById("registerForm")
  .addEventListener("submit", async e => {
    e.preventDefault();

    const nombres = document.getElementById("nombres").value;
    const apellidos = document.getElementById("apellidos").value;
    const nacimiento = document.getElementById("nacimiento").value;
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (password !== confirm) {
      alert("Las contraseñas no coinciden");
      return;
    }

    const body = {
      name: `${nombres} ${apellidos}`,
      username,
      nacimiento,
      email,
      password
    };

    try {
      const res = await fetch(
        "https://mcme-backend.onrender.com/api/auth/register",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }
      );

      const data = await res.json();
      alert(data.message);

      if (res.ok) {
        window.location.href = "login.html";
      }

    } catch (err) {
      alert("Error de conexión con el servidor");
    }
});
</script>

</body>
</html>
