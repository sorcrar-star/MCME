<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Biblioteca Médica</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/registro.css" />
</head>

<body class="register-page">

<main class="register-container">

  <img 
    src="assets/images/mcme-logo.svg"
    alt="MCME"
    class="register-logo"
  />

  <h1 class="register-title">Crear cuenta académica</h1>

  <form id="registerForm" class="register-form">
    <input placeholder="Nombres" id="nombres" required />
    <input placeholder="Apellidos" id="apellidos" required />
    <input type="date" id="nacimiento" required />
    <input placeholder="Nombre de usuario" id="username" required />
    <input type="email" placeholder="Correo institucional" id="email" required />
    <input type="password" placeholder="Contraseña" id="password" required />
    <input type="password" placeholder="Confirmar contraseña" id="confirm" required />

    <button type="submit">Registrar cuenta</button>
  </form>

  <button 
    type="button"
    class="volver-login"
    onclick="window.location.href='login.html'">
    Volver al login
  </button>

</main>

<script>
document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();

  const nombres = document.getElementById("nombres").value;
  const apellidos = document.getElementById("apellidos").value;
  const nacimiento = document.getElementById("nacimiento").value;
  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    alert("Las contraseñas no coinciden");
    return;
  }

  const body = {
    name: `${nombres} ${apellidos}`,
    username,
    nacimiento,
    email,
    password
  };

  try {
    const res = await fetch(
      "https://mcme-backend.onrender.com/api/auth/register",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }
    );

    if (res.ok) {
      alert("Registrado con éxito. Espera 24 horas máximas para validar tu información o contacta con soporte.");
      window.location.href = "login.html";
      return;
    }

    const data = await res.json();
    alert(data.message || "Error al registrar");

  } catch (err) {
    alert("Error de conexión con el servidor");
  }
});
</script>

</body>
</html>
