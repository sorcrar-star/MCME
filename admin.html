<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel Admin | MCME</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>

<body class="admin-page">

<header id="app-header">
  <div class="header-left">
    <img src="assets/images/mcme-logo.svg" alt="MCME" class="app-logo" />
  </div>

  <div class="header-right">
    <strong class="admin-badge">Administrador</strong>

    <!-- Toggle Dark Mode -->
    <button id="themeToggle" class="admin-theme-toggle">
      🌙
    </button>

    <button id="logoutBtn" class="admin-logout">
      Cerrar sesión
    </button>
  </div>
</header>

<main class="admin-container">

  <h1 class="admin-title">Panel de Control de Usuarios</h1>

  <div class="admin-grid">

    <section class="admin-section pending-section">
      <h2>Usuarios pendientes</h2>
      <ul id="users" class="admin-list"></ul>
    </section>

    <section class="admin-section approved-section">
      <h2>Usuarios aprobados</h2>
      <ul id="approvedUsers" class="admin-list"></ul>
    </section>

    <section class="admin-section suspended-section">
      <h2>Usuarios suspendidos</h2>
      <ul id="suspendedUsers" class="admin-list"></ul>
    </section>

  </div>

</main>

<script>
const ADMIN_EMAIL = "sorcrar@gmail.com";
const API = "https://mcme-backend.onrender.com/api/admin";

/* ==========================
   SEGURIDAD
========================== */
const session = JSON.parse(localStorage.getItem("user"));
if (!session || session.email !== ADMIN_EMAIL) {
  window.location.href = "login.html";
}

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("user");
  window.location.href = "login.html";
};

/* ==========================
   DARK MODE
========================== */

const themeToggle = document.getElementById("themeToggle");

function applySavedTheme() {
  const savedTheme = localStorage.getItem("admin-theme");
  if (savedTheme === "dark") {
    document.body.classList.add("dark-mode");
    themeToggle.textContent = "☀️";
  }
}

themeToggle.onclick = () => {
  document.body.classList.toggle("dark-mode");

  if (document.body.classList.contains("dark-mode")) {
    localStorage.setItem("admin-theme", "dark");
    themeToggle.textContent = "☀️";
  } else {
    localStorage.setItem("admin-theme", "light");
    themeToggle.textContent = "🌙";
  }
};

applySavedTheme();

/* ==========================
   USUARIOS
========================== */

async function loadUsers() {
  const res = await fetch(`${API}/pending`, {
    headers: { "x-admin-email": ADMIN_EMAIL }
  });

  const users = await res.json();
  const ul = document.getElementById("users");
  ul.innerHTML = "";

  if (users.length === 0) {
    ul.innerHTML = "<p class='empty-state'>No hay usuarios pendientes.</p>";
    return;
  }

  users.forEach(u => {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="admin-card">
        <div class="admin-user-info">
          <strong>${u.name}</strong>
          <span>${u.email}</span>
        </div>
        <div class="admin-actions">
          <button class="admin-btn btn-approve" onclick="approve('${u.email}')">Aprobar</button>
          <button class="admin-btn btn-reject" onclick="reject('${u.email}')">Rechazar</button>
        </div>
      </div>
    `;
    ul.appendChild(li);
  });
}

async function approve(email) {
  await fetch(`${API}/approve`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadUsers();
  loadApprovedUsers();
}

async function reject(email) {
  await fetch(`${API}/reject`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadUsers();
}

async function loadApprovedUsers() {
  const res = await fetch(`${API}/approved`, {
    headers: { "x-admin-email": ADMIN_EMAIL }
  });

  const users = await res.json();
  const ul = document.getElementById("approvedUsers");
  ul.innerHTML = "";

  if (users.length === 0) {
    ul.innerHTML = "<p class='empty-state'>No hay usuarios aprobados.</p>";
    return;
  }

  users.forEach(u => {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="admin-card approved-card">
        <div class="admin-user-info">
          <strong>${u.name}</strong>
          <span>${u.email}</span>
        </div>
        <button class="admin-btn btn-revoke" onclick="revoke('${u.email}')">
          Quitar acceso
        </button>
      </div>
    `;
    ul.appendChild(li);
  });
}

async function revoke(email) {
  await fetch(`${API}/revoke`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadApprovedUsers();
  loadSuspendedUsers();
}

async function loadSuspendedUsers() {
  const res = await fetch(`${API}/suspended`, {
    headers: { "x-admin-email": ADMIN_EMAIL }
  });

  const users = await res.json();
  const ul = document.getElementById("suspendedUsers");
  ul.innerHTML = "";

  if (users.length === 0) {
    ul.innerHTML = "<p class='empty-state'>No hay usuarios suspendidos.</p>";
    return;
  }

  users.forEach(u => {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="admin-card suspended-card">
        <div class="admin-user-info">
          <strong>${u.name}</strong>
          <span>${u.email}</span>
        </div>
        <button class="admin-btn btn-reactivate" onclick="reactivate('${u.email}')">
          Reactivar acceso
        </button>
      </div>
    `;
    ul.appendChild(li);
  });
}

async function reactivate(email) {
  await fetch(`${API}/reactivate`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-admin-email": ADMIN_EMAIL
    },
    body: JSON.stringify({ email })
  });

  loadSuspendedUsers();
  loadApprovedUsers();
}

loadUsers();
loadApprovedUsers();
loadSuspendedUsers();
</script>

</body>
</html>
