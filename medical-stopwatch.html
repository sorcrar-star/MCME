<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Código Azul – MCME</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/sidebar.css" />
  <link rel="stylesheet" href="assets/css/medical-stopwatch.css" />
</head>

<body>

<header id="app-header">
  <div class="header-left">
    <img src="assets/images/mcme-logo.svg" alt="MCME" class="app-logo" />
  </div>

  <nav class="header-nav">
    <a href="index.html">Inicio</a>
    <a href="index.html">Biblioteca</a>
    <a href="aplicaciones.html" class="active">Aplicaciones</a>
  </nav>

  <div class="header-right">
    <span>usuario@mcme.mx</span>
    <button type="button" id="logoutBtn">Cerrar sesión</button>
  </div>
</header>

<div class="app-container">

  <aside id="app-sidebar">
    <div class="sidebar-presets">
      <h3>Escenarios RCP/ACLS</h3>
      <button id="preset0" class="preset-btn">Inicio RCP (0:00)</button>
      <button id="preset120" class="preset-btn">2:00 – Cambio compresor</button>
      <button id="preset180" class="preset-btn">3:00 – Epinefrina</button>
      <button id="preset240" class="preset-btn">4:00 – Chequeo vías aéreas</button>
      <button id="preset300" class="preset-btn">5:00 – 2ª Epinefrina</button>
      <button id="preset420" class="preset-btn">7:00 – Check desfibrilador</button>
      <button id="preset480" class="preset-btn">8:00 – 3ª Epinefrina</button>
      <button id="preset600" class="preset-btn">10:00 – Intubación</button>
      <button id="preset900" class="preset-btn">15:00 – Informe</button>
      <button id="preset1800" class="preset-btn">30:00 – Tiempo crítico</button>
    </div>
  </aside>

  <main class="app-main">
    <section class="stopwatch-container">
      <h1>Código Azul – RCP & ACLS</h1>

      <div class="controls-top">
        <label>
          Modo:
          <select id="modeSelect">
            <option value="countup">Contador ascendente</option>
            <option value="countdown">Cuenta regresiva</option>
          </select>
        </label>
        <label>
          Duración (MM:SS):
          <input id="durationInput" type="text" placeholder="05:00" />
        </label>
        <label>
          Mensaje al 0:
          <input id="zeroMessage" type="text" placeholder="Paciente no responde" />
        </label>
        <label title="Alterna sonido de alertas">
          <input id="soundToggle" type="checkbox" /> Sonido
        </label>
      </div>

      <div class="timer-display" id="timerDisplay" aria-live="polite">
        00:00
      </div>

      <div class="timer-controls">
        <button id="startBtn" class="primary">Iniciar</button>
        <button id="pauseBtn">Pausar</button>
        <button id="resetBtn">Reset</button>
        <button id="markBtn">Marcar tiempo</button>
        <button id="exportLogBtn">Exportar log</button>
      </div>

      <div class="event-buttons">
        <button data-event="paro" class="event-btn">⏱ Tiempo de Paro</button>
        <button data-event="rcp" class="event-btn">💓 Ciclos RCP</button>
        <button data-event="epi" class="event-btn">💉 Epinefrina</button>
        <button data-event="defib" class="event-btn">⚡ Desfibrilación</button>
      </div>

      <div class="event-log" id="eventLog">
        <h3>Registro de Eventos</h3>
        <ul id="logList"></ul>
      </div>
    </section>
  </main>

</div>

<script defer src="assets/js/components/medical-stopwatch.js"></script>
</body>
</html>
