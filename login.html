<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Biblioteca Médica</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
</head>

<body class="login-page">

  <main class="login-container">

    <!-- Toggle Dark Mode -->
    <button id="themeToggle" class="theme-toggle">
      🌙 Modo oscuro
    </button>

    <img
      src="assets/images/mcme-logo.svg"
      alt="MCME"
      style="width: 220px; margin-bottom: 1.5rem;"
    />

    <form id="loginForm" class="login-form">
      <input
        type="email"
        id="email"
        placeholder="Ingresa tu correo o nombre de usuario"
        required
      />

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        required
      />

      <button type="submit">Iniciar sesión</button>
    </form>

    <button class="crear-cuenta" type="button"
      onclick="window.location.href='registro.html'">
      Crear cuenta nueva
    </button>

    <p class="login-note">
      Estado de pruebas (Página en modo beta)
    </p>

  </main>

  <script>
  // ===============================
  // DARK MODE CONTROL
  // ===============================

  const toggleBtn = document.getElementById("themeToggle");

  // Cargar preferencia guardada
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  toggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
      localStorage.setItem("theme", "dark");
      toggleBtn.textContent = "☀️ Modo claro";
    } else {
      localStorage.setItem("theme", "light");
      toggleBtn.textContent = "🌙 Modo oscuro";
    }
  });

  // Ajustar texto inicial del botón
  if (document.body.classList.contains("dark-mode")) {
    toggleBtn.textContent = "☀️ Modo claro";
  }


  // ===============================
  // LOGIN ORIGINAL (SIN CAMBIOS)
  // ===============================

  const form = document.getElementById("loginForm");
  const ADMIN_EMAIL = "sorcrar@gmail.com";
  const ADMIN_PASSWORD = "root";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
      localStorage.setItem(
        "user",
        JSON.stringify({ email, name: "Administrador" })
      );
      window.location.href = "admin.html";
      return;
    }

    try {
      const response = await fetch(
        "https://mcme-backend.onrender.com/api/auth/login",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        }
      );

      const data = await response.json();

      if (response.status === 403) {
        alert(data.message);
        return;
      }

      if (!response.ok) {
        alert(data.message || "Error al iniciar sesión");
        return;
      }

      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "index.html";

    } catch (error) {
      alert("No se pudo conectar con el servidor");
    }
  });
  </script>

</body>
</html>
