<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Médica Digital</title>

  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />

  <link rel="stylesheet" href="assets/css/header.css" />
  <link rel="stylesheet" href="assets/css/sidebar.css" />
  <link rel="stylesheet" href="assets/css/book-card.css" />
  <link rel="stylesheet" href="assets/css/pdf-modal.css" />
  <link rel="stylesheet" href="assets/css/notes-panel.css" />
</head>

<body>

<!-- ================= HEADER ================= -->
<header id="app-header">

  <!-- IZQUIERDA: LOGO -->
  <div class="header-left">
    <img
      src="assets/images/mcme-logo.svg"
      alt="MCME"
      class="app-logo"
    />
  </div>

  <!-- CENTRO: NAV DEMO (temporal) -->
  <nav class="header-nav">
    <a href="#" class="active">Inicio</a>
    <a href="#">Biblioteca</a>
    <a href="#">Favoritos</a>
  </nav>

  <!-- DERECHA: USUARIO -->
  <div class="header-right">
    <span>usuario@mcme.mx</span>
    <button type="button" id="logoutBtn">
      Cerrar sesión
    </button>
  </div>

</header>
<!-- ========================================= -->

<div class="app-container">

  <aside id="app-sidebar"></aside>

  <main class="app-main">

    <section class="search-section">
      <nav id="breadcrumbs" class="breadcrumbs"></nav>

      <input
        type="search"
        id="search-input"
        placeholder="Buscar libro, tema o autor…"
      />
    </section>

    <section class="content-area">
      <section id="booksGrid" class="books-grid"></section>
    </section>

  </main>

</div>

<!-- ================= PDF VIEWER ================= -->
<section id="pdfViewer" class="pdf-modal hidden">

  <div class="pdf-modal-content">

    <header class="pdf-modal-header">
      <span id="pdfTitle"></span>

      <div class="actions">
        <button id="openNotesFromPdf">📝 Notas</button>
        <button id="closePdfBtn">✕ Cerrar</button>
      </div>
    </header>

    <div
      id="pdfCanvasContainer"
      class="pdf-canvas-container"
    ></div>

  </div>

</section>
<!-- ============================================= -->

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
